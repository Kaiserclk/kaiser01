controller_manager:
  ros__parameters:
    update_rate: 10  # Hz

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    forward_position_controller:
      type:  position_controllers/JointGroupPositionController

    mecanum_drive_controller:
      type: mecanum_drive_controller/MecanumDriveController 

forward_position_controller:
  ros__parameters:
    joints:
      - arm_joint1
      - arm_joint2
      - arm_joint3
      - arm_joint4
      - arm_joint5
      - arm_joint6
    interface_name: position

  # wheelbase = 0.216   # 前后轴距
  # track_width = 0.195 # 左右轴距
  # wheel_diameter = 0.097  # 轮子直径

mecanum_drive_controller:
  ros__parameters:
    reference_timeout: 0.9

    front_left_wheel_command_joint_name: "wheel_left_front_joint"
    front_right_wheel_command_joint_name: "wheel_right_front_joint"
    rear_right_wheel_command_joint_name: "wheel_right_back_joint"
    rear_left_wheel_command_joint_name: "wheel_left_back_joint"

    kinematics:
      base_frame_offset: { x: 0.0, y: 0.0, theta: 0.0 }
      wheels_radius: 0.0485
      sum_of_robot_center_projection_on_X_Y_axis: 0.2055

    base_frame_id: "base_link"
    odom_frame_id: "odom"
    enable_odom_tf: true
    twist_covariance_diagonal: [0.0, 7.0, 14.0, 21.0, 28.0, 35.0]
    pose_covariance_diagonal: [0.0, 6.0, 12.0, 18.0, 24.0, 30.0]