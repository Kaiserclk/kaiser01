controller_manager:
  ros__parameters:
    update_rate: 20  # Hz

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    mecanum_drive_controller:
      type: mecanum_drive_controller/MecanumDriveController

    imu_broadcaster:
      type: imu_sensor_broadcaster/IMUSensorBroadcaster

#麦轮控制器参数
mecanum_drive_controller:
  ros__parameters:
    # Wheel joint names (must match URDF joint names)
    front_left_wheel_command_joint_name: wheel_left_front_joint
    front_right_wheel_command_joint_name: wheel_right_front_joint
    rear_right_wheel_command_joint_name: wheel_right_back_joint
    rear_left_wheel_command_joint_name: wheel_left_back_joint

    # Kinematics parameters (must match physical robot)
    kinematics:
      wheels_radius: 0.0485  # wheel_diameter / 2 = 0.097 / 2
      sum_of_robot_center_projection_on_X_Y_axis: 0.2055  # (wheelbase + track_width) / 2 = (0.216 + 0.195) / 2

    # Odometry and TF
    base_frame_id: base_footprint
    odom_frame_id: odom
    enable_odom_tf: true
    tf_frame_prefix_enable: false
    use_stamped_vel: false

    # Command timeout
    reference_timeout: 0.5

    # Covariance diagonals for odometry
    pose_covariance_diagonal: [0.001, 0.001, 1.0e+6, 1.0e+6, 1.0e+6, 0.001]
    twist_covariance_diagonal: [0.001, 0.001, 1.0e+6, 1.0e+6, 1.0e+6, 0.001]

imu_broadcaster:
  ros__parameters:
    sensor_name: imu_sensor
    frame_id: imu_link
    static_covariance_orientation: [0.01, 0.0, 0.0, 0.0, 0.01, 0.0, 0.0, 0.0, 0.01]
    static_covariance_angular_velocity: [0.01, 0.0, 0.0, 0.0, 0.01, 0.0, 0.0, 0.0, 0.01]
    static_covariance_linear_acceleration: [0.0004, 0.0, 0.0, 0.0, 0.0004, 0.0, 0.0, 0.0, 0.004]

joint_state_broadcaster:
  ros__parameters: 
    joints:
      - wheel_left_front_joint
      - wheel_left_back_joint
      - wheel_right_front_joint
      - wheel_right_back_joint
      - arm_joint1
      - arm_joint2
      - arm_joint3
      - arm_joint4
      - arm_joint5
      - arm_joint6
    interfaces:
      - position
      - velocity
