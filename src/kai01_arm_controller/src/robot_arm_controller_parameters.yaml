robot_arm_controller:
  joints: {
    type: string_array,
    default_value: [],
    description: "Name of the joints to control",
  }
  interface_names: {
    type: string_array,
    default_value: ["position", "duration"],
    description: "Names of the interfaces to command (position and duration for servos)",
  }
  init_arm_pose: {
    type: double_array,
    default_value: [0.0, -0.9, 1.57, 1.57, 0.0, 1.2],
    description: "Initial pose of the robot arm",
  }
  deactivate_arm_pose: {
    type: double_array,
    default_value: [0.0, -0.9, 1.57, 1.57, 0.0, 1.2],
    description: "Deactivate pose of the robot arm",
  }